name: tests

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Test
        run: python -m unittest discover -s tests -v

  cmc-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CMC dependencies
        run: python -m pip install ".[cmc]"
      - name: Test CMC modules
        run: >-
          python -m unittest discover -s tests -p "test_cmc*.py" -v
          && python -m unittest tests.test_legacy_cmc tests.test_neuro_registry -v
