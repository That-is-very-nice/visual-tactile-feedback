# Copy this file to configs/cmc.local.toml and set the two local data paths.

[paths]
eeglab_set_dir = "/path/to/eeglab/set"
annotation_dir = "/path/to/eeg/annotation"

[neuro]
subjects = [
  "qh",
  "wxl",
  "zys",
  "lzy",
  "xl",
  "zhb",
  "phoom",
  "prae",
  "maple",
  "pepper",
  "ice",
  "regina",
  "ljj",
  "pathe",
  "pun",
]
conditions = ["st_no", "st_tf2"]
visual_condition = "st_no"
tactile_condition = "st_tf2"
epoch_bounds_label = "[0 60]"
start_annotation = "DC trigger 13"
stop_annotation = "DC trigger 14"
expected_epoch_count = 5
expected_trial_duration_s = 60.0
trial_duration_tolerance_s = 0.1
expected_eeg_channel_count = 61
expected_emg_channel_count = 1

[neuro.subject_condition_event_codes.qh]
st_no = 1
st_tf2 = 8

[neuro.subject_condition_event_codes.wxl]
st_no = 1
st_tf2 = 9

[neuro.subject_condition_event_codes.zys]
st_no = 1
st_tf2 = 9

