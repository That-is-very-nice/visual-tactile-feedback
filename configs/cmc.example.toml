st_no = 1
st_tf2 = 9

[neuro.subject_condition_event_codes.zhb]
st_no = 1
st_tf2 = 9

[neuro.subject_condition_event_codes.phoom]
st_no = 1
st_tf2 = 9

[neuro.subject_condition_event_codes.prae]
st_no = 1
st_tf2 = 9

[neuro.subject_condition_event_codes.maple]
st_no = 1
st_tf2 = 9

[neuro.subject_condition_event_codes.pepper]
st_no = 1
st_tf2 = 9

[neuro.subject_condition_event_codes.ice]
st_no = 1
st_tf2 = 9

[neuro.subject_condition_event_codes.regina]
st_no = 1
st_tf2 = 9

[neuro.subject_condition_event_codes.ljj]
st_no = 1
st_tf2 = 9

[neuro.subject_condition_event_codes.pathe]
st_no = 1
st_tf2 = 9

[neuro.subject_condition_event_codes.pun]
st_no = 1
st_tf2 = 9

[cmc]
trial_indices = [2, 3, 4, 5]
tmin_s = 10.0
tmax_s = 60.0
segment_duration_s = 10.0
expected_segment_count = 20
expected_sampling_rate_hz = 1000.0
eeg_preprocessing = "paper: 1-58 Hz, average reference, bad-channel interpolation, ICA, +/-100 uV, CSD"
emg_filter_after_alignment = "none"
emg_rectification = false
estimator = "multitaper magnitude-squared coherence"
apply_csd = true
csd_stiffness = 4.0
csd_n_legendre_terms = 50
csd_lambda2 = 0.00001
spectral_range_hz = [2.0, 58.0]
multitaper_bandwidth_hz = 2.0
multitaper_adaptive = true
confidence_alpha = 0.05
summary_metric = "max_mean_suprathreshold_excess"
roi_channels = [
  "CP5", "CP3", "CP1", "CPz",
  "C5", "C3", "C1", "Cz",
  "FC5", "FC3", "FC1", "FCz",
]

[cmc.bands_hz]
alpha = [8.0, 13.0]
beta = [13.0, 30.0]
gamma = [30.0, 58.0]

[cmc_regression]
expected_statistics_file = "cmc_corrected_expected.json"
absolute_tolerance = 0.000000000001
